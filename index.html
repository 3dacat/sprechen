<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Простой кликер</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #1a1a2e;
    color: #eee;
    font-family: 'Segoe UI', Arial, sans-serif;
    user-select: none;
    padding: 20px;
  }
  h1 { margin-bottom: 14px; font-size: 1.6em; }

  .level-bar-wrap {
    width: 100%;
    max-width: 380px;
    background: #16213e;
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 18px;
  }
  .level-bar-top {
    display: flex;
    justify-content: space-between;
    font-size: 0.95em;
    margin-bottom: 8px;
  }
  .level-bar-top span { color: #f4d03f; font-weight: bold; }
  .level-bar {
    height: 18px;
    background: #0f1628;
    border-radius: 9px;
    overflow: hidden;
  }
  .level-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #27ae60, #2ecc71);
    border-radius: 9px;
    transition: width 0.15s ease;
  }

  .stats {
    display: flex;
    gap: 20px;
    margin: 10px 0;
    font-size: 1.05em;
    flex-wrap: wrap;
    justify-content: center;
  }
  .stats div { background: #16213e; padding: 8px 16px; border-radius: 8px; }
  .stats span { color: #f4d03f; font-weight: bold; }

  #clickBtn {
    width: 260px;
    height: 260px;
    border-radius: 50%;
    border: none;
    font-size: 1.4em;
    font-weight: bold;
    color: #fff;
    background: radial-gradient(circle at 30% 30%, #e74c3c, #a93226);
    box-shadow: 0 8px 0 #7b241c, 0 12px 25px rgba(0,0,0,0.5);
    cursor: pointer;
    transition: transform 0.05s, box-shadow 0.05s;
    margin: 20px 0;
  }
  #clickBtn:active {
    transform: translateY(6px);
    box-shadow: 0 2px 0 #7b241c, 0 5px 12px rgba(0,0,0,0.5);
  }
  #clickBtn:hover { filter: brightness(1.08); }

  .upgrades {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 380px;
  }
  .upgrade {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #16213e;
    padding: 12px 16px;
    border-radius: 10px;
    gap: 10px;
  }
  .upgrade .info { font-size: 0.95em; line-height: 1.4; }
  .upgrade .info small { color: #9aa4b2; }
  .upgrade button {
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: #27ae60;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s;
  }
  .upgrade button:hover:not(:disabled) { background: #2ecc71; }
  .upgrade button:disabled { background: #444; cursor: not-allowed; color: #888; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modal-overlay.hidden { display: none; }
  .modal {
    background: #16213e;
    padding: 30px 40px;
    border-radius: 16px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    max-width: 360px;
  }
  .modal h2 { margin-bottom: 10px; font-size: 1.3em; }
  .modal p { margin-bottom: 22px; color: #9aa4b2; font-size: 0.95em; }
  .modal-buttons { display: flex; gap: 16px; justify-content: center; }
  .modal-buttons button {
    padding: 14px 34px;
    border: none;
    border-radius: 10px;
    font-size: 1.1em;
    font-weight: bold;
    cursor: pointer;
    transition: filter 0.15s;
  }
  .modal-buttons button:hover { filter: brightness(1.15); }
  #btnYes { background: #27ae60; color: #fff; }
  #btnNo  { background: #c0392b; color: #fff; }

  .closed-screen {
    position: fixed;
    inset: 0;
    background: #000;
    color: #c0392b;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2em;
    font-weight: bold;
    z-index: 200;
  }
  .closed-screen.hidden { display: none; }
</style>
</head>
<body>

<h1>👆 Кликер</h1>

<div class="level-bar-wrap">
  <div class="level-bar-top">
    <div>Уровень: <span id="level">1</span></div>
    <div><span id="progressText">0 / 10</span> кликов</div>
  </div>
  <div class="level-bar">
    <div class="level-bar-fill" id="levelBarFill"></div>
  </div>
</div>

<div class="stats">
  <div>Всего кликов: <span id="totalClicks">0</span></div>
</div>

<button id="clickBtn">КЛИК</button>

<div class="upgrades">
  <div class="upgrade">
    <div class="info">
      <strong>Прокачать клик</strong><br>
      <small id="clickUpCostInfo">Стоимость: 10 кликов</small>
    </div>
    <button id="clickUpBtn" disabled>Прокачать</button>
  </div>
</div>

<div class="modal-overlay hidden" id="welcomeModal">
  <div class="modal">
    <h2>Привет!</h2>
    <p>Готов начать кликать?</p>
    <div class="modal-buttons">
      <button id="btnYes">Йа</button>
      <button id="btnNo">Найн</button>
    </div>
  </div>
</div>

<div class="closed-screen hidden" id="closedScreen">Игра закрыта</div>

<script>
  // ================= MP3-ЗВУКИ (заданные) =================
  const mp3 = {
    morning: new Audio('morgen.mp3'),
    day:     new Audio('tag.mp3'),
    evening: new Audio('abend.mp3'),
    start:   new Audio('deutch.mp3'),
    levelUp: new Audio('fantastisch.mp3')
  };
  Object.values(mp3).forEach(a => a.addEventListener('error', () => {}));

  function playMp3(audio) {
    if (!audio) return;
    try {
      audio.currentTime = 0;
      const p = audio.play();
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }

  // ================= СИНТЕЗИРОВАННЫЕ ЗВУКИ =================
  // Ленивая инициализация AudioContext (браузеры требуют жест пользователя)
  let audioCtx = null;
  function getCtx() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  // Универсальный генератор тона с огибающей
  function tone(ctx, { freq, type = 'sine', start = 0, dur = 0.15, gain = 0.2, slideTo = null }) {
    const t0 = ctx.currentTime + start;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo !== null) {
      osc.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t0 + dur);
    }
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  }

  // Короткий шумовой всплеск (для «щёлчка»)
  function noiseBurst(ctx, { start = 0, dur = 0.05, gain = 0.15, highpass = 1500 }) {
    const t0 = ctx.currentTime + start;
    const bufferSize = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    }
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = highpass;
    const g = ctx.createGain();
    g.gain.setValueAtTime(gain, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(hp).connect(g).connect(ctx.destination);
    src.start(t0);
    src.stop(t0 + dur + 0.02);
  }

  // ---- ЗВУК КЛИКА ----
  // Щелчок: очень короткий высокий тон + шумовой всплеск.
  // Ощущается как «тук» по кнопке.
  function playClickSound() {
    const ctx = getCtx();
    if (!ctx) return;
    tone(ctx, { freq: 1400, type: 'triangle', dur: 0.05, gain: 0.18, slideTo: 700 });
    noiseBurst(ctx, { dur: 0.03, gain: 0.12, highpass: 2000 });
  }

  // ---- ЗВУК КАССЫ ----
  // Двойной металлический «дзынь»: два тона с интервалом + лёгкий шум.
  // Первый тон — высокий (2200 Гц), второй чуть ниже (1760 Гц) с задержкой.
  function playCashSound() {
    const ctx = getCtx();
    if (!ctx) return;
    // Основной звон
    tone(ctx, { freq: 2200, type: 'sine', dur: 0.12, gain: 0.22 });
    tone(ctx, { freq: 3300, type: 'sine', dur: 0.08, gain: 0.12 }); // обертон
    // Второй удар «кассы»
    tone(ctx, { freq: 1760, type: 'sine', start: 0.09, dur: 0.18, gain: 0.2 });
    tone(ctx, { freq: 2640, type: 'sine', start: 0.09, dur: 0.12, gain: 0.1 });
    // Металлический шумовой призвук
    noiseBurst(ctx, { start: 0, dur: 0.06, gain: 0.06, highpass: 4000 });
    noiseBurst(ctx, { start: 0.09, dur: 0.08, gain: 0.05, highpass: 3500 });
  }

  // ================= СОСТОЯНИЕ ИГРЫ =================
  let totalClicks = 0;
  let level = 1;
  let levelProgress = 0;

  const CLICK_POWER = 1;
  const START_THRESHOLD = 10;
  let levelStep = START_THRESHOLD;

  let clickUpCost = 10;

  let lastThresholdLevel = 1;
  const THRESHOLD_LEVEL_INTERVAL = 50;

  // ================= ЭЛЕМЕНТЫ =================
  const totalClicksEl  = document.getElementById('totalClicks');
  const levelEl        = document.getElementById('level');
  const progressTextEl = document.getElementById('progressText');
  const levelBarFill   = document.getElementById('levelBarFill');

  const clickBtn       = document.getElementById('clickBtn');
  const clickUpBtn     = document.getElementById('clickUpBtn');
  const clickUpCostInfo = document.getElementById('clickUpCostInfo');

  const welcomeModal   = document.getElementById('welcomeModal');
  const btnYes         = document.getElementById('btnYes');
  const btnNo          = document.getElementById('btnNo');
  const closedScreen   = document.getElementById('closedScreen');

  // ================= UI =================
  function updateUI() {
    totalClicksEl.textContent = totalClicks;
    levelEl.textContent = level;

    progressTextEl.textContent = levelProgress + ' / ' + levelStep;
    levelBarFill.style.width = (levelProgress / levelStep * 100) + '%';

    const canReduceThreshold = (level >= lastThresholdLevel + THRESHOLD_LEVEL_INTERVAL);
    clickUpCostInfo.textContent = canReduceThreshold
      ? 'Стоимость: ' + clickUpCost + ' кликов'
      : 'Доступно на ' + (lastThresholdLevel + THRESHOLD_LEVEL_INTERVAL) + ' уровне';

    clickUpBtn.disabled = !(canReduceThreshold && totalClicks >= clickUpCost);
    clickUpBtn.textContent = clickUpBtn.disabled
      ? (canReduceThreshold ? 'Не хватает' : 'Закрыто')
      : 'Прокачать';
  }

  // ================= КЛИК =================
  clickBtn.addEventListener('click', () => {
    totalClicks += CLICK_POWER;
    levelProgress += CLICK_POWER;

    playClickSound();

    let leveledUp = false;
    while (levelProgress >= levelStep) {
      levelProgress -= levelStep;
      level += 1;
      leveledUp = true;
    }

    if (leveledUp) {
      playMp3(mp3.levelUp);
      playCashSound();
    }

    updateUI();
  });

  // ================= ПРОКАЧКА =================
  clickUpBtn.addEventListener('click', () => {
    if (clickUpBtn.disabled) return;

    const canReduceThreshold = (level >= lastThresholdLevel + THRESHOLD_LEVEL_INTERVAL);
    if (!canReduceThreshold || totalClicks < clickUpCost) return;

    totalClicks -= clickUpCost;
    levelStep = Math.max(1, levelStep - 1);
    lastThresholdLevel = level;

    let leveledUp = false;
    while (levelProgress >= levelStep) {
      levelProgress -= levelStep;
      level += 1;
      leveledUp = true;
    }
    if (leveledUp) {
      playMp3(mp3.levelUp);
      playCashSound();
    }

    clickUpCost = Math.ceil(clickUpCost * 1.5);
    updateUI();
  });

  // ================= ВРЕМЯ СУТОК =================
  function playTimeOfDaySound() {
    const hour = new Date().getHours();
    if (hour >= 5 && hour < 12)      playMp3(mp3.morning);
    else if (hour >= 12 && hour < 18) playMp3(mp3.day);
    else                              playMp3(mp3.evening);
  }

  // ================= СТАРТ =================
  function startGame() {
    // Инициализируем AudioContext по первому жесту (клик по меню)
    playMp3(mp3.start);
    welcomeModal.classList.remove('hidden');
  }

  btnYes.addEventListener('click', () => {
    welcomeModal.classList.add('hidden');
    try { mp3.start.pause(); } catch (e) {}
    getCtx(); // разблокируем звук
    playTimeOfDaySound();
  });

  btnNo.addEventListener('click', () => {
    welcomeModal.classList.add('hidden');
    try { mp3.start.pause(); } catch (e) {}
    closedScreen.classList.remove('hidden');
  });

  updateUI();
  startGame();
</script>

</body>
</html>
