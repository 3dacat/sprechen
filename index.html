<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Шпрехер</title>
<style>
  :root {
    --bg-top: #0b1f1a;
    --bg-bottom: #04100d;
    --panel: #123028;
    --panel-2: #0d241e;
    --panel-border: #1d4a3d;
    --accent: #f4d03f;
    --accent-2: #e8b923;
    --green: #2ecc71;
    --green-dark: #1e8f4e;
    --red: #e74c3c;
    --red-dark: #a93226;
    --text: #e6f4ee;
    --muted: #7fa89a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    scrollbar-width: thin;
    scrollbar-color: var(--accent) var(--bg-bottom);
  }

  ::-webkit-scrollbar { width: 14px; height: 14px; }
  ::-webkit-scrollbar-track {
    background: linear-gradient(180deg, #061a15, #04100d);
    border-radius: 10px;
    box-shadow: inset 0 0 6px rgba(0,0,0,0.6);
  }
  ::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, var(--accent), var(--accent-2) 50%, #b8860b);
    border-radius: 10px;
    border: 2px solid #04100d;
    box-shadow: 0 0 8px rgba(244, 208, 63, 0.6),
                inset 0 0 4px rgba(255,255,255,0.4);
    animation: thumbPulse 2s ease-in-out infinite;
    background-size: 100% 200%;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: linear-gradient(180deg, #ffe066, var(--accent) 50%, var(--accent-2));
    box-shadow: 0 0 16px rgba(244, 208, 63, 0.9),
                inset 0 0 6px rgba(255,255,255,0.7);
    animation-play-state: paused;
  }
  ::-webkit-scrollbar-thumb:active {
    background: linear-gradient(180deg, #fff3a0, #ffe066);
  }
  ::-webkit-scrollbar-corner { background: var(--bg-bottom); }

  @keyframes thumbPulse {
    0%, 100% {
      box-shadow: 0 0 8px rgba(244, 208, 63, 0.55),
                  inset 0 0 4px rgba(255,255,255,0.4);
      background-position: 0% 0%;
    }
    50% {
      box-shadow: 0 0 16px rgba(244, 208, 63, 0.95),
                  inset 0 0 6px rgba(255,255,255,0.7);
      background-position: 0% 100%;
    }
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, #0f2e26 0%, var(--bg-top) 40%, var(--bg-bottom) 100%);
    background-attachment: fixed;
    color: var(--text);
    font-family: 'Segoe UI', Arial, sans-serif;
    user-select: none;
    padding: 20px 20px 40px;
  }
  h1 {
    margin-bottom: 14px;
    font-size: 1.6em;
    color: var(--accent);
    text-shadow: 0 2px 10px rgba(244, 208, 63, 0.35);
    letter-spacing: 1px;
  }

  .level-bar-wrap {
    width: 100%;
    max-width: 380px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 18px;
    box-shadow: inset 0 0 12px rgba(0,0,0,0.4);
  }
  .level-bar-top {
    display: flex;
    justify-content: space-between;
    font-size: 0.95em;
    margin-bottom: 8px;
    color: var(--muted);
  }
  .level-bar-top span { color: var(--accent); font-weight: bold; }
  .level-bar {
    height: 18px;
    background: #061a15;
    border-radius: 9px;
    overflow: hidden;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
  }
  .level-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--green-dark), var(--green));
    border-radius: 9px;
    transition: width 0.15s ease;
    box-shadow: 0 0 10px rgba(46, 204, 113, 0.6);
  }

  .stats {
    display: flex;
    gap: 20px;
    margin: 10px 0;
    font-size: 1.05em;
    flex-wrap: wrap;
    justify-content: center;
  }
  .stats div {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    padding: 8px 16px;
    border-radius: 8px;
  }
  .stats span { color: var(--accent); font-weight: bold; }

  .button-stage {
    position: relative;
    width: 340px;
    height: 340px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 20px 0;
    flex-shrink: 0;
  }

  .finger {
    position: absolute;
    font-size: 2.2em;
    line-height: 1;
    pointer-events: none;
    filter: drop-shadow(0 0 6px rgba(244, 208, 63, 0.6));
    animation: fingerPulse 1.6s ease-in-out infinite;
    z-index: 5;
  }
  .finger:nth-child(2) { animation-delay: 0s; }
  .finger:nth-child(3) { animation-delay: 0.2s; }
  .finger:nth-child(4) { animation-delay: 0.4s; }
  .finger:nth-child(5) { animation-delay: 0.6s; }

  .finger-top {
    top: 0;
    left: 50%;
    transform: translateX(-50%) rotate(180deg);
  }
  .finger-bottom {
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
  }
  .finger-left {
    left: 0;
    top: 50%;
    transform: translateY(-50%) rotate(90deg);
  }
  .finger-right {
    right: 0;
    top: 50%;
    transform: translateY(-50%) rotate(-90deg);
  }

  @keyframes fingerPulse {
    0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 4px rgba(244, 208, 63, 0.5)); }
    50%      { opacity: 1;    filter: drop-shadow(0 0 12px rgba(244, 208, 63, 0.95)); }
  }

  #clickBtn {
    position: relative;
    width: 260px;
    height: 260px;
    border-radius: 50%;
    border: 3px solid rgba(244, 208, 63, 0.35);
    font-size: 1.4em;
    font-weight: bold;
    color: #fff;
    background: radial-gradient(circle at 30% 30%, #ff6b5b, var(--red) 45%, var(--red-dark) 100%);
    box-shadow: 0 8px 0 #6e1f16, 0 12px 25px rgba(0,0,0,0.6);
    cursor: pointer;
    transition: transform 0.05s, box-shadow 0.05s;
    overflow: hidden;
    animation: breathe 2.6s ease-in-out infinite, glow 2.6s ease-in-out infinite;
    -webkit-tap-highlight-color: transparent;
    text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    z-index: 2;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.03); }
  }

  @keyframes glow {
    0%, 100% { box-shadow: 0 8px 0 #6e1f16, 0 12px 25px rgba(0,0,0,0.6), 0 0 0 rgba(231,76,60,0); }
    50%      { box-shadow: 0 8px 0 #6e1f16, 0 12px 25px rgba(0,0,0,0.6), 0 0 34px rgba(244, 208, 63, 0.6); }
  }

  #clickBtn:active {
    transform: translateY(6px) scale(0.97);
    box-shadow: 0 2px 0 #6e1f16, 0 5px 12px rgba(0,0,0,0.6);
    animation: none;
  }

  #clickBtn:hover { filter: brightness(1.08); }

  #clickBtn::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -60%;
    width: 40%;
    height: 200%;
    background: linear-gradient(
      to right,
      rgba(255,255,255,0) 0%,
      rgba(255,255,255,0.35) 50%,
      rgba(255,255,255,0) 100%
    );
    transform: rotate(25deg);
    animation: shine 4s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes shine {
    0%, 60%   { left: -60%; }
    100%      { left: 130%; }
  }

  #clickBtn span { position: relative; z-index: 1; }

  #clickBtn.pressed::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    animation: pressFlash 0.25s ease-out;
    pointer-events: none;
  }

  @keyframes pressFlash {
    from { opacity: 0.8; transform: scale(1); }
    to   { opacity: 0;   transform: scale(1.15); }
  }

  #clickBtn.level-up { animation: levelJump 0.6s ease-out; }

  @keyframes levelJump {
    0%   { transform: scale(1); }
    30%  { transform: scale(1.18) rotate(-3deg); }
    55%  { transform: scale(0.95) rotate(3deg); }
    80%  { transform: scale(1.05) rotate(-1deg); }
    100% { transform: scale(1); }
  }

  .floating-popup {
    position: fixed;
    pointer-events: none;
    font-weight: 900;
    font-size: 1.5em;
    color: var(--accent);
    text-shadow:
      0 0 8px rgba(244, 208, 63, 0.9),
      0 2px 4px rgba(0, 0, 0, 0.8);
    white-space: nowrap;
    z-index: 300;
    will-change: transform, opacity;
    animation: floatUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    transform-origin: center;
  }

  .floating-popup.level-popup {
    font-size: 2em;
    color: #fff;
    text-shadow:
      0 0 12px rgba(46, 204, 113, 1),
      0 0 24px rgba(46, 204, 113, 0.8),
      0 2px 6px rgba(0, 0, 0, 0.9);
    animation: floatUpLevel 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  @keyframes floatUp {
    0% {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.4);
    }
    15% {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.15);
    }
    35% {
      opacity: 1;
      transform: translate(-50%, -70%) scale(1);
    }
    100% {
      opacity: 0;
      transform: translate(-50%, -180%) scale(0.9);
    }
  }

  @keyframes floatUpLevel {
    0% {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.3) rotate(-8deg);
    }
    20% {
      opacity: 1;
      transform: translate(-50%, -55%) scale(1.3) rotate(3deg);
    }
    40% {
      opacity: 1;
      transform: translate(-50%, -75%) scale(1.1) rotate(-2deg);
    }
    100% {
      opacity: 0;
      transform: translate(-50%, -200%) scale(0.8) rotate(0deg);
    }
  }

  .upgrades {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 380px;
    margin-bottom: 20px;
  }
  .upgrade {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    padding: 12px 16px;
    border-radius: 10px;
    gap: 10px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .upgrade:hover {
    border-color: rgba(244, 208, 63, 0.4);
    box-shadow: 0 0 12px rgba(244, 208, 63, 0.12);
  }
  .upgrade .info { font-size: 0.95em; line-height: 1.4; }
  .upgrade .info small { color: var(--muted); }
  .upgrade button {
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(180deg, var(--green), var(--green-dark));
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
    transition: filter 0.15s, transform 0.1s;
    box-shadow: 0 3px 0 #145c32;
  }
  .upgrade button:hover:not(:disabled) {
    filter: brightness(1.15);
    transform: translateY(-1px);
  }
  .upgrade button:active:not(:disabled) {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #145c32;
  }
  .upgrade button:disabled {
    background: #1a2a25;
    box-shadow: 0 3px 0 #0a1410;
    color: #566e64;
    cursor: not-allowed;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(2, 12, 9, 0.85);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modal-overlay.hidden { display: none; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    padding: 30px 40px;
    border-radius: 16px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.7), 0 0 30px rgba(244, 208, 63, 0.1);
    max-width: 360px;
  }
  .modal h2 { margin-bottom: 10px; font-size: 1.3em; color: var(--accent); }
  .modal p { margin-bottom: 22px; color: var(--muted); font-size: 0.95em; }
  .modal-buttons { display: flex; gap: 16px; justify-content: center; }
  .modal-buttons button {
    padding: 14px 34px;
    border: none;
    border-radius: 10px;
    font-size: 1.1em;
    font-weight: bold;
    cursor: pointer;
    transition: filter 0.15s, transform 0.1s;
  }
  .modal-buttons button:hover { filter: brightness(1.15); transform: translateY(-1px); }
  #btnYes {
    background: linear-gradient(180deg, var(--green), var(--green-dark));
    color: #fff;
    box-shadow: 0 4px 0 #145c32;
  }
  #btnNo {
    background: linear-gradient(180deg, var(--red), var(--red-dark));
    color: #fff;
    box-shadow: 0 4px 0 #6e1f16;
  }

  .closed-screen {
    position: fixed;
    inset: 0;
    background: #000;
    color: var(--red);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2em;
    font-weight: bold;
    z-index: 200;
  }
  .closed-screen.hidden { display: none; }

  #confettiCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 150;
  }
</style>
</head>
<body>

<h1>👆 Шпрехер</h1>

<div class="level-bar-wrap">
  <div class="level-bar-top">
    <div>Уровень: <span id="level">1</span></div>
    <div><span id="progressText">0 / 10</span> кликов</div>
  </div>
  <div class="level-bar">
    <div class="level-bar-fill" id="levelBarFill"></div>
  </div>
</div>

<div class="stats">
  <div>Всего кликов: <span id="totalClicks">0</span></div>
  <div>Цена клика: <span id="clickValue">1</span></div>
</div>

<div class="button-stage">
  <span class="finger finger-top">👆</span>
  <span class="finger finger-left">👆</span>
  <span class="finger finger-right">👆</span>
  <span class="finger finger-bottom">👆</span>
  <button id="clickBtn"><span>Шпрехать</span></button>
</div>

<div class="upgrades">
  <div class="upgrade">
    <div class="info">
      <strong>Прокачать цену клика</strong><br>
      <small id="powerUpInfo">Доступно на 10 уровне</small>
    </div>
    <button id="powerUpBtn" disabled>Прокачать</button>
  </div>

  <div class="upgrade">
    <div class="info">
      <strong>Сократить порог уровня</strong><br>
      <small id="thresholdUpInfo">Доступно на 50 уровне</small>
    </div>
    <button id="thresholdUpBtn" disabled>Сократить</button>
  </div>
</div>

<div class="modal-overlay hidden" id="welcomeModal">
  <div class="modal">
    <h2>Привет!</h2>
    <p>Готов начать шпрехать?</p>
    <div class="modal-buttons">
      <button id="btnYes">Йа</button>
      <button id="btnNo">Найн</button>
    </div>
  </div>
</div>

<div class="closed-screen hidden" id="closedScreen">Игра закрыта</div>

<canvas id="confettiCanvas"></canvas>

<script>
  // ================= MP3-ЗВУКИ =================
  const mp3 = {
    morning: new Audio('morgen.mp3'),
    day:     new Audio('tag.mp3'),
    evening: new Audio('abend.mp3'),
    start:   new Audio('deutch.mp3'),
    levelUp: new Audio('fantastisch.mp3')
  };
  Object.values(mp3).forEach(a => a.addEventListener('error', () => {}));

  // Пул копий Ja.mp3 (играет каждый 3-й клик)
  const JA_POOL_SIZE = 3;
  const jaPool = [];
  for (let i = 0; i < JA_POOL_SIZE; i++) {
    const a = new Audio('Ja.mp3');
    a.addEventListener('error', () => {});
    jaPool.push(a);
  }
  let jaPoolIndex = 0;

  function playJaSound() {
    const a = jaPool[jaPoolIndex];
    jaPoolIndex = (jaPoolIndex + 1) % JA_POOL_SIZE;
    try {
      a.currentTime = 0;
      const p = a.play();
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }

  function playMp3(audio) {
    if (!audio) return;
    try {
      audio.currentTime = 0;
      const p = audio.play();
      if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  }

  // ================= СИНТЕЗ ЗВУКОВ =================
  let audioCtx = null;
  function getCtx() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function tone(ctx, { freq, type = 'sine', start = 0, dur = 0.15, gain = 0.2, slideTo = null }) {
    const t0 = ctx.currentTime + start;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo !== null) {
      osc.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t0 + dur);
    }
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  }

  function noiseBurst(ctx, { start = 0, dur = 0.05, gain = 0.15, highpass = 1500 }) {
    const t0 = ctx.currentTime + start;
    const bufferSize = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    }
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = highpass;
    const g = ctx.createGain();
    g.gain.setValueAtTime(gain, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(hp).connect(g).connect(ctx.destination);
    src.start(t0);
    src.stop(t0 + dur + 0.02);
  }

  function playClickSound() {
    const ctx = getCtx();
    if (!ctx) return;
    tone(ctx, { freq: 1400, type: 'triangle', dur: 0.05, gain: 0.18, slideTo: 700 });
    noiseBurst(ctx, { dur: 0.03, gain: 0.12, highpass: 2000 });
  }

  function playCashSound() {
    const ctx = getCtx();
    if (!ctx) return;
    tone(ctx, { freq: 2200, type: 'sine', dur: 0.12, gain: 0.22 });
    tone(ctx, { freq: 3300, type: 'sine', dur: 0.08, gain: 0.12 });
    tone(ctx, { freq: 1760, type: 'sine', start: 0.09, dur: 0.18, gain: 0.2 });
    tone(ctx, { freq: 2640, type: 'sine', start: 0.09, dur: 0.12, gain: 0.1 });
    noiseBurst(ctx, { start: 0, dur: 0.06, gain: 0.06, highpass: 4000 });
    noiseBurst(ctx, { start: 0.09, dur: 0.08, gain: 0.05, highpass: 3500 });
  }

  // ================= ВСПЛЫВАЮЩИЕ НАДПИСИ =================
  function showFloatingPopup(text, x, y, isLevel = false) {
    const el = document.createElement('div');
    el.className = 'floating-popup' + (isLevel ? ' level-popup' : '');
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    document.body.appendChild(el);
    const life = isLevel ? 1200 : 900;
    setTimeout(() => el.remove(), life + 50);
  }

  function showClickPopup() {
    const rect = clickBtn.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const dx = (Math.random() - 0.5) * rect.width * 0.6;
    const dy = -rect.height * 0.15 - Math.random() * 30;
    showFloatingPopup('+' + clickValue, cx + dx, cy + dy, false);
  }

  function showLevelPopup() {
    const rect = clickBtn.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2 - rect.height * 0.35;
    showFloatingPopup('Уровень ' + level + '!', cx, cy, true);
  }

  // ================= КОНФЕТТИ =================
  const canvas = document.getElementById('confettiCanvas');
  const cctx = canvas.getContext('2d');
  let confettiParticles = [];
  let confettiAnimId = null;

  function resizeCanvas() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  const CONFETTI_COLORS = [
    '#f4d03f', '#e74c3c', '#2ecc71', '#3498db',
    '#9b59b6', '#e67e22', '#1abc9c', '#ff79c6'
  ];

  function getButtonCenter() {
    const rect = clickBtn.getBoundingClientRect();
    return {
      x: rect.left + rect.width / 2,
      y: rect.top + rect.height / 2,
      radius: rect.width / 2
    };
  }

  function spawnConfetti(count = 140) {
    const c = getButtonCenter();
    const innerRadius = c.radius * 0.35;

    for (let i = 0; i < count; i++) {
      const angle = (-Math.PI / 2) + (Math.random() - 0.5) * Math.PI * 1.3;
      const speed = 6 + Math.random() * 9;

      const r = Math.random() * innerRadius;
      const a = Math.random() * Math.PI * 2;
      const ox = Math.cos(a) * r;
      const oy = Math.sin(a) * r;

      confettiParticles.push({
        x: c.x + ox,
        y: c.y + oy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: 5 + Math.random() * 7,
        color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
        rotation: Math.random() * Math.PI * 2,
        rotationSpeed: (Math.random() - 0.5) * 0.3,
        shape: Math.random() < 0.5 ? 'rect' : 'circle',
        gravity: 0.18 + Math.random() * 0.1,
        drag: 0.985,
        life: 1
      });
    }
    if (!confettiAnimId) {
      confettiAnimId = requestAnimationFrame(updateConfetti);
    }
  }

  function updateConfetti() {
    cctx.clearRect(0, 0, canvas.width, canvas.height);

    confettiParticles = confettiParticles.filter(p => p.life > 0 && p.y < canvas.height + 40);

    for (const p of confettiParticles) {
      p.vx *= p.drag;
      p.vy *= p.drag;
      p.vy += p.gravity;
      p.x += p.vx;
      p.y += p.vy;
      p.rotation += p.rotationSpeed;
      p.life -= 0.006;

      cctx.save();
      cctx.globalAlpha = Math.max(0, p.life);
      cctx.translate(p.x, p.y);
      cctx.rotate(p.rotation);
      cctx.fillStyle = p.color;

      if (p.shape === 'rect') {
        cctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      } else {
        cctx.beginPath();
        cctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
        cctx.fill();
      }
      cctx.restore();
    }

    if (confettiParticles.length > 0) {
      confettiAnimId = requestAnimationFrame(updateConfetti);
    } else {
      confettiAnimId = null;
      cctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }

  // ================= СОСТОЯНИЕ =================
  let totalClicks = 0;
  let level = 1;
  let levelProgress = 0;

  let clickValue = 1;
  const PROGRESS_PER_CLICK = 1;

  const START_THRESHOLD = 10;
  let levelStep = START_THRESHOLD;

  let powerUpCost = 10;
  let powerUpAvailable = 0;

  let lastThresholdLevel = 1;
  const THRESHOLD_LEVEL_INTERVAL = 50;
  let thresholdUpCost = 50;

  // Счётчик кликов для Ja.mp3 — играет каждый 3-й клик
  let clickCounter = 0;

  // ================= ЭЛЕМЕНТЫ =================
  const totalClicksEl  = document.getElementById('totalClicks');
  const clickValueEl   = document.getElementById('clickValue');
  const levelEl        = document.getElementById('level');
  const progressTextEl = document.getElementById('progressText');
  const levelBarFill   = document.getElementById('levelBarFill');

  const clickBtn       = document.getElementById('clickBtn');
  const powerUpBtn     = document.getElementById('powerUpBtn');
  const powerUpInfo    = document.getElementById('powerUpInfo');
  const thresholdUpBtn = document.getElementById('thresholdUpBtn');
  const thresholdUpInfo = document.getElementById('thresholdUpInfo');

  const welcomeModal   = document.getElementById('welcomeModal');
  const btnYes         = document.getElementById('btnYes');
  const btnNo          = document.getElementById('btnNo');
  const closedScreen   = document.getElementById('closedScreen');

  // ================= UI =================
  function updateUI() {
    totalClicksEl.textContent = totalClicks;
    clickValueEl.textContent = clickValue;
    levelEl.textContent = level;

    progressTextEl.textContent = levelProgress + ' / ' + levelStep;
    levelBarFill.style.width = (levelProgress / levelStep * 100) + '%';

    if (powerUpAvailable > 0) {
      powerUpInfo.textContent = 'Стоимость: ' + powerUpCost + ' кликов (доступно: ' + powerUpAvailable + ')';
      powerUpBtn.disabled = totalClicks < powerUpCost;
      powerUpBtn.textContent = powerUpBtn.disabled ? 'Не хватает' : 'Прокачать';
    } else {
      const nextLevel = Math.ceil(level / 10) * 10;
      powerUpInfo.textContent = 'Доступно на ' + nextLevel + ' уровне';
      powerUpBtn.disabled = true;
      powerUpBtn.textContent = 'Закрыто';
    }

    const canReduceThreshold = (level >= lastThresholdLevel + THRESHOLD_LEVEL_INTERVAL);
    if (canReduceThreshold) {
      thresholdUpInfo.textContent = 'Стоимость: ' + thresholdUpCost + ' кликов';
      thresholdUpBtn.disabled = totalClicks < thresholdUpCost;
      thresholdUpBtn.textContent = thresholdUpBtn.disabled ? 'Не хватает' : 'Сократить';
    } else {
      thresholdUpInfo.textContent = 'Доступно на ' + (lastThresholdLevel + THRESHOLD_LEVEL_INTERVAL) + ' уровне';
      thresholdUpBtn.disabled = true;
      thresholdUpBtn.textContent = 'Закрыто';
    }
  }

  function grantPowerUpCharges(prevLevel, newLevel) {
    const prevTens = Math.floor(prevLevel / 10);
    const newTens = Math.floor(newLevel / 10);
    if (newTens > prevTens) {
      powerUpAvailable += (newTens - prevTens);
    }
  }

  function onLevelUp() {
    playMp3(mp3.levelUp);
    playCashSound();
    spawnConfetti(140);
    showLevelPopup();

    clickBtn.classList.remove('level-up');
    void clickBtn.offsetWidth;
    clickBtn.classList.add('level-up');
    setTimeout(() => clickBtn.classList.remove('level-up'), 650);
  }

  // ================= КЛИК =================
  clickBtn.addEventListener('click', () => {
    totalClicks += clickValue;
    levelProgress += PROGRESS_PER_CLICK;
    playClickSound();
    showClickPopup();

    // Ja.mp3 — только каждый 3-й клик
    clickCounter++;
    if (clickCounter % 3 === 0) {
      playJaSound();
    }

    clickBtn.classList.add('pressed');
    setTimeout(() => clickBtn.classList.remove('pressed'), 250);

    let leveledUp = false;
    const prevLevel = level;
    while (levelProgress >= levelStep) {
      levelProgress -= levelStep;
      level += 1;
      leveledUp = true;
    }

    if (leveledUp) {
      grantPowerUpCharges(prevLevel, level);
      onLevelUp();
    }

    updateUI();
  });

  // ================= ПРОКАЧКА ЦЕНЫ КЛИКА =================
  powerUpBtn.addEventListener('click', () => {
    if (powerUpAvailable <= 0) return;
    if (totalClicks < powerUpCost) return;

    totalClicks -= powerUpCost;
    clickValue += 1;
    powerUpAvailable -= 1;

    powerUpCost = Math.ceil(powerUpCost * 1.5);
    updateUI();
  });

  // ================= СОКРАЩЕНИЕ ПОРОГА =================
  thresholdUpBtn.addEventListener('click', () => {
    if (thresholdUpBtn.disabled) return;

    const canReduceThreshold = (level >= lastThresholdLevel + THRESHOLD_LEVEL_INTERVAL);
    if (!canReduceThreshold || totalClicks < thresholdUpCost) return;

    totalClicks -= thresholdUpCost;
    levelStep = Math.max(1, levelStep - 1);
    lastThresholdLevel = level;

    powerUpAvailable = 0;

    let leveledUp = false;
    const prevLevel = level;
    while (levelProgress >= levelStep) {
      levelProgress -= levelStep;
      level += 1;
      leveledUp = true;
    }
    if (leveledUp) {
      grantPowerUpCharges(prevLevel, level);
      onLevelUp();
    }

    thresholdUpCost = Math.ceil(thresholdUpCost * 1.5);
    updateUI();
  });

  // ================= ВРЕМЯ СУТОК =================
  function playTimeOfDaySound() {
    const hour = new Date().getHours();
    if (hour >= 5 && hour < 12)       playMp3(mp3.morning);
    else if (hour >= 12 && hour < 18) playMp3(mp3.day);
    else                              playMp3(mp3.evening);
  }

  // ================= СТАРТ =================
  function startGame() {
    playMp3(mp3.start);
    welcomeModal.classList.remove('hidden');
  }

  btnYes.addEventListener('click', () => {
    welcomeModal.classList.add('hidden');
    try { mp3.start.pause(); } catch (e) {}
    getCtx();
    playTimeOfDaySound();
  });

  btnNo.addEventListener('click', () => {
    welcomeModal.classList.add('hidden');
    try { mp3.start.pause(); } catch (e) {}
    closedScreen.classList.remove('hidden');
  });

  updateUI();
  startGame();
</script>

</body>
</html>
